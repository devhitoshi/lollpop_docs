<title>ろりぽエゴサ仕分け</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
  :root {
    --pink: #d6006e;
    --pink-deep: #b0005b;
    --pink-soft: #ff9ecb;
    --ink: #1d1216;
    --body: #45383e;
    --muted: #71646b;
    --muted-soft: #998a92;
    --hairline: #f2e2ea;
    --canvas: #fffdfe;
    --surface: #ffffff;
    --blush: #fff5f9;
    --blush-strong: #f6d3e3;
    --slate: #5c6672;
    --slate-soft: #e3e7ec;
    --shadow: 0 10px 30px rgba(29, 18, 22, .10);
    --shadow-lift: 0 18px 44px rgba(29, 18, 22, .16);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --pink: #ff5fa8;
      --pink-deep: #ff86bf;
      --pink-soft: #7a2450;
      --ink: #fff5f9;
      --body: #e6d4dc;
      --muted: #b49fab;
      --muted-soft: #8b7783;
      --hairline: #3a2630;
      --canvas: #160f12;
      --surface: #241a20;
      --blush: #2a1a24;
      --blush-strong: #3d2733;
      --slate: #9fb0c2;
      --slate-soft: #2c333c;
      --shadow: 0 10px 30px rgba(0, 0, 0, .5);
      --shadow-lift: 0 18px 44px rgba(0, 0, 0, .6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --pink: #ff5fa8;
    --pink-deep: #ff86bf;
    --pink-soft: #7a2450;
    --ink: #fff5f9;
    --body: #e6d4dc;
    --muted: #b49fab;
    --muted-soft: #8b7783;
    --hairline: #3a2630;
    --canvas: #160f12;
    --surface: #241a20;
    --blush: #2a1a24;
    --blush-strong: #3d2733;
    --slate: #9fb0c2;
    --slate-soft: #2c333c;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    --shadow-lift: 0 18px 44px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--body);
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", Meiryo, sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  .app {
    height: 100%;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px;
    box-sizing: border-box;
  }

  /* ---- header ---- */
  .bar { padding-block: 14px 10px; display: flex; flex-direction: column; gap: 10px; }
  .headrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--pink);
  }
  h1 { margin: 0; font-size: 15px; font-weight: 700; color: var(--ink); letter-spacing: .01em; }
  .period { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .tabs { display: flex; gap: 6px; }
  .tab {
    appearance: none; border: 1px solid var(--hairline); background: var(--surface);
    color: var(--muted); font: inherit; font-size: 12px; font-weight: 700;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .tab[aria-selected="true"] { background: var(--pink); border-color: var(--pink); color: #fff; }

  .meter { height: 4px; background: var(--hairline); border-radius: 999px; overflow: hidden; }
  .meter-fill { height: 100%; width: 0%; background: var(--pink); transition: width .25s ease; }
  .stats {
    display: flex; gap: 14px; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums; align-items: center; flex-wrap: wrap;
  }
  .stats b { color: var(--ink); font-weight: 700; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: -1px; }
  .dot.rel { background: var(--pink); }
  .dot.non { background: var(--slate); }
  .sync { margin-left: auto; font-size: 11px; color: var(--muted-soft); }

  /* ---- card stage ---- */
  .stage { position: relative; }
  .card {
    position: absolute; inset: 0;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 18px;
    display: flex; flex-direction: column; gap: 12px;
    box-sizing: border-box;
    touch-action: pan-y;
    will-change: transform;
  }
  .card.behind { transform: scale(.955) translateY(10px); box-shadow: none; opacity: .75; }
  .card.behind2 { transform: scale(.915) translateY(20px); box-shadow: none; opacity: .45; }
  .card.top { box-shadow: var(--shadow-lift); }
  .card.animate { transition: transform .28s cubic-bezier(.22,.61,.36,1), opacity .28s ease; }

  .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .handle { font-size: 14px; font-weight: 700; color: var(--ink); word-break: break-all; }
  .when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .badge {
    font-size: 10px; font-weight: 700; letter-spacing: .06em;
    padding: 3px 8px; border-radius: 999px;
    background: var(--blush); color: var(--pink); border: 1px solid var(--blush-strong);
  }
  .posttext {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    font-size: 16px; line-height: 1.75; color: var(--body);
    white-space: pre-wrap; word-break: break-word;
  }
  .numbers {
    display: flex; gap: 16px; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums; border-top: 1px solid var(--hairline); padding-top: 10px;
  }
  .numbers a { color: var(--pink); text-decoration: none; margin-left: auto; font-weight: 700; }
  .numbers a:hover { text-decoration: underline; }

  .verdict {
    position: absolute; top: 18px; font-size: 13px; font-weight: 900; letter-spacing: .08em;
    padding: 7px 14px; border-radius: 8px; opacity: 0; pointer-events: none;
    border: 2px solid currentColor;
  }
  .verdict.yes { right: 18px; color: var(--pink); transform: rotate(8deg); }
  .verdict.no  { left: 18px;  color: var(--slate); transform: rotate(-8deg); }

  /* ---- controls ---- */
  .controls {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center;
    padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .btn {
    appearance: none; font: inherit; font-weight: 700; font-size: 15px;
    border-radius: 14px; padding: 15px 10px; cursor: pointer; border: 1.5px solid;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  .btn-no  { background: var(--surface); border-color: var(--slate-soft); color: var(--slate); }
  .btn-yes { background: var(--pink); border-color: var(--pink); color: #fff; }
  .btn-undo {
    background: transparent; border-color: transparent; color: var(--muted);
    font-size: 12px; padding: 12px 10px;
  }
  .btn[disabled] { opacity: .4; cursor: default; }
  .keyhint { font-size: 10px; opacity: .7; font-weight: 500; }

  /* ---- done ---- */
  .done {
    position: absolute; inset: 0; display: none; flex-direction: column; gap: 14px;
    align-items: flex-start; justify-content: center; padding: 24px;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 18px;
    box-sizing: border-box; overflow-y: auto;
  }
  .done.show { display: flex; }
  .done h2 { margin: 0; font-size: 20px; color: var(--ink); }
  .done p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .tally { display: flex; gap: 20px; font-variant-numeric: tabular-nums; }
  .tally div { display: flex; flex-direction: column; gap: 2px; }
  .tally b { font-size: 30px; font-weight: 900; color: var(--ink); line-height: 1; }
  .tally span { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
  .out {
    width: 100%; box-sizing: border-box; height: 130px; resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.6; color: var(--body);
    background: var(--blush); border: 1px solid var(--hairline); border-radius: 10px; padding: 10px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .note { font-size: 11px; color: var(--muted-soft); line-height: 1.7; }

  @media (prefers-reduced-motion: reduce) {
    .card.animate, .meter-fill { transition: none; }
  }
</style>

<div class="app">
  <header class="bar">
    <div class="headrow">
      <div>
        <div class="eyebrow">ろりぽっぷ!!!!!!! エゴサ仕分け</div>
        <h1 id="deckname">要判定</h1>
      </div>
      <div class="period">__PERIOD_LABEL__</div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-review" role="tab" aria-selected="true" type="button">要判定</button>
      <button class="tab" id="tab-adopt" role="tab" aria-selected="false" type="button">採用候補</button>
    </div>
    <div class="meter"><div class="meter-fill" id="meter"></div></div>
    <div class="stats">
      <span><span class="dot rel"></span>関連 <b id="n-yes">0</b></span>
      <span><span class="dot non"></span>別物 <b id="n-no">0</b></span>
      <span>残り <b id="n-left">0</b></span>
      <span class="sync" id="sync">読み込み中…</span>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="done" id="done">
      <h2 id="done-title">ぜんぶ見終わりました</h2>
      <div class="tally">
        <div><b id="d-yes">0</b><span>ろりぽっぷ関連</span></div>
        <div><b id="d-no">0</b><span>別物</span></div>
      </div>
      <p id="done-msg"></p>
      <textarea class="out" id="out" readonly aria-label="判定ファイルの中身"></textarea>
      <div class="row">
        <button class="btn btn-yes" id="copy" type="button" style="font-size:13px;padding:11px 18px;">判定をコピー</button>
        <button class="btn btn-no" id="again" type="button" style="font-size:13px;padding:11px 18px;">もう一度見る</button>
      </div>
      <p class="note" id="staffnote"></p>
    </div>
  </main>

  <footer class="controls">
    <button class="btn btn-no" id="btn-no" type="button">別物 <span class="keyhint">←</span></button>
    <button class="btn btn-undo" id="btn-undo" type="button" disabled>戻す<br><span class="keyhint">Z</span></button>
    <button class="btn btn-yes" id="btn-yes" type="button">関連 <span class="keyhint">→</span></button>
  </footer>
</div>

<script type="application/json" id="deckdata">__DECK_JSON__</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("deckdata").textContent);
  var PERIOD = "__PERIOD__";
  var DOC_PATH = "decisions/" + PERIOD;
  var LS_KEY = "lollpop-triage-" + PERIOD;

  var decisions = {};           // id -> "adopt" | "reject"
  var history = [];             // [{id, prev}]
  var deck = "review";
  var db = null;
  var dirty = false, writing = false, writeTimer = null;

  var el = {
    stage: document.getElementById("stage"),
    done: document.getElementById("done"),
    meter: document.getElementById("meter"),
    nYes: document.getElementById("n-yes"),
    nNo: document.getElementById("n-no"),
    nLeft: document.getElementById("n-left"),
    sync: document.getElementById("sync"),
    deckname: document.getElementById("deckname"),
    tabReview: document.getElementById("tab-review"),
    tabAdopt: document.getElementById("tab-adopt"),
    btnYes: document.getElementById("btn-yes"),
    btnNo: document.getElementById("btn-no"),
    btnUndo: document.getElementById("btn-undo"),
    out: document.getElementById("out"),
    dYes: document.getElementById("d-yes"),
    dNo: document.getElementById("d-no"),
    doneTitle: document.getElementById("done-title"),
    doneMsg: document.getElementById("done-msg"),
    staffnote: document.getElementById("staffnote"),
    copy: document.getElementById("copy"),
    again: document.getElementById("again")
  };

  el.tabReview.textContent = "要判定 " + DATA.review.length;
  el.tabAdopt.textContent = "採用候補 " + DATA.adopt.length;
  el.staffnote.textContent = "マネージャー @nanotabiyori の投稿 " + DATA.staff_removed +
    " 件は関係者なので、この束から外してあります。";

  function items() { return deck === "review" ? DATA.review : DATA.adopt; }
  function defaultOf(it) { return deck === "adopt" ? "adopt" : null; }

  /* ---------- storage ---------- */
  function readLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) return JSON.parse(raw) || {};
    } catch (e) {}
    return {};
  }
  function writeLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(decisions)); } catch (e) {}
  }
  function scheduleWrite() {
    dirty = true;
    writeLocal();
    if (!db) { el.sync.textContent = "この端末にだけ保存"; return; }
    el.sync.textContent = "保存中…";
    if (writeTimer) clearTimeout(writeTimer);
    writeTimer = setTimeout(flush, 500);
  }
  function flush() {
    if (!db || writing || !dirty) return;
    writing = true; dirty = false;
    var body = { period: PERIOD, decisions: decisions, updatedAt: new Date().toISOString() };
    db.doc(DOC_PATH).set(body).then(function () {
      writing = false;
      if (dirty) flush(); else el.sync.textContent = "保存済み";
    }).catch(function (err) {
      writing = false;
      el.sync.textContent = (err && err.code === "not_granted") ? "この端末にだけ保存" : "保存できず（端末には残ります）";
    });
  }

  /* ---------- rendering ---------- */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function queue() {
    return items().filter(function (it) {
      return !Object.prototype.hasOwnProperty.call(decisions, it.id);
    });
  }
  function buildCard(it, cls) {
    var c = document.createElement("div");
    c.className = "card " + cls;
    c.innerHTML =
      '<div class="meta">' +
        '<span class="handle">' + esc(it.handle) + '</span>' +
        '<span class="when">' + esc(it.dt) + '</span>' +
        (it.tag ? '<span class="badge">' + esc(it.tag) + '</span>' : '') +
      '</div>' +
      '<div class="posttext">' + esc(it.text) + '</div>' +
      '<div class="numbers">' +
        '<span>いいね ' + it.likes.toLocaleString() + '</span>' +
        '<span>表示 ' + it.views.toLocaleString() + '</span>' +
        '<a href="https://x.com/' + encodeURIComponent(it.handle.replace(/^@/, "")) +
          '/status/' + encodeURIComponent(it.id) + '" target="_blank" rel="noopener">X で開く</a>' +
      '</div>' +
      '<div class="verdict yes">関連</div>' +
      '<div class="verdict no">別物</div>';
    return c;
  }

  var topCard = null, current = null;

  function render() {
    var q = queue();
    var all = items();
    var yes = 0, no = 0;
    all.forEach(function (it) {
      var d = decisions[it.id];
      if (d === "adopt") yes++; else if (d === "reject") no++;
    });
    el.nYes.textContent = yes;
    el.nNo.textContent = no;
    el.nLeft.textContent = q.length;
    el.meter.style.width = all.length ? ((all.length - q.length) / all.length * 100) + "%" : "0%";
    el.btnUndo.disabled = history.length === 0;

    Array.prototype.slice.call(el.stage.querySelectorAll(".card")).forEach(function (n) { n.remove(); });

    if (!q.length) {
      current = null; topCard = null;
      el.done.classList.add("show");
      el.dYes.textContent = yes;
      el.dNo.textContent = no;
      el.doneTitle.textContent = deck === "review" ? "要判定はぜんぶ見終わりました" : "採用候補をぜんぶ確認しました";
      el.doneMsg.textContent = "下のテキストを data/x/egosearch_decisions_" + PERIOD +
        ".txt に貼れば、そのまま判定ファイルになります。";
      el.out.value = exportText();
      el.btnYes.disabled = el.btnNo.disabled = true;
      return;
    }
    el.done.classList.remove("show");
    el.btnYes.disabled = el.btnNo.disabled = false;

    if (q[2]) el.stage.appendChild(buildCard(q[2], "behind2"));
    if (q[1]) el.stage.appendChild(buildCard(q[1], "behind"));
    current = q[0];
    topCard = buildCard(q[0], "top");
    el.stage.appendChild(topCard);
    attachDrag(topCard);
  }

  function exportText() {
    var lines = ["# ろりぽっぷ!!!!!!! エゴサーチ判定 " + PERIOD.replace("_", " 〜 ")];
    var order = DATA.review.concat(DATA.adopt);
    var seen = {};
    order.forEach(function (it) {
      if (seen[it.id]) return;
      seen[it.id] = 1;
      var d = decisions[it.id];
      if (d) lines.push(it.id + " " + d);
    });
    return lines.join("\n");
  }

  /* ---------- decide ---------- */
  function decide(verdict, dir) {
    if (!current) return;
    var it = current;
    history.push({ id: it.id, prev: decisions[it.id] });
    decisions[it.id] = verdict;
    scheduleWrite();
    if (topCard) {
      var card = topCard;
      topCard = null;
      card.classList.add("animate");
      card.style.transform = "translateX(" + (dir * window.innerWidth * 1.2) + "px) rotate(" + (dir * 18) + "deg)";
      card.style.opacity = "0";
      setTimeout(render, 180);
    } else {
      render();
    }
  }
  function undo() {
    var last = history.pop();
    if (!last) return;
    if (last.prev === undefined) delete decisions[last.id];
    else decisions[last.id] = last.prev;
    scheduleWrite();
    render();
  }

  /* ---------- drag ---------- */
  function attachDrag(card) {
    var startX = 0, startY = 0, dx = 0, dy = 0, active = false, pid = null;
    var yesTag = card.querySelector(".verdict.yes");
    var noTag = card.querySelector(".verdict.no");

    card.addEventListener("pointerdown", function (e) {
      if (e.target.closest("a")) return;
      if (e.target.closest(".posttext") && e.pointerType !== "mouse") {
        var pt = e.target.closest(".posttext");
        if (pt.scrollHeight > pt.clientHeight + 2) return;
      }
      active = true; pid = e.pointerId;
      startX = e.clientX; startY = e.clientY; dx = dy = 0;
      card.setPointerCapture(pid);
      card.classList.remove("animate");
    });
    card.addEventListener("pointermove", function (e) {
      if (!active || e.pointerId !== pid) return;
      dx = e.clientX - startX;
      dy = e.clientY - startY;
      if (Math.abs(dy) > Math.abs(dx) * 1.5 && Math.abs(dx) < 12) return;
      card.style.transform = "translate(" + dx + "px," + (dy * .25) + "px) rotate(" + (dx / 18) + "deg)";
      var p = Math.min(1, Math.abs(dx) / 110);
      yesTag.style.opacity = dx > 0 ? p : 0;
      noTag.style.opacity = dx < 0 ? p : 0;
    });
    function end(e) {
      if (!active || (e && e.pointerId !== pid)) return;
      active = false;
      var threshold = Math.min(110, card.offsetWidth * 0.28);
      if (dx > threshold) { decide("adopt", 1); return; }
      if (dx < -threshold) { decide("reject", -1); return; }
      card.classList.add("animate");
      card.style.transform = "";
      yesTag.style.opacity = 0;
      noTag.style.opacity = 0;
    }
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", end);
  }

  /* ---------- wiring ---------- */
  el.btnYes.addEventListener("click", function () { decide("adopt", 1); });
  el.btnNo.addEventListener("click", function () { decide("reject", -1); });
  el.btnUndo.addEventListener("click", undo);
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowRight") { e.preventDefault(); decide("adopt", 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); decide("reject", -1); }
    else if (e.key === "z" || e.key === "Z") { e.preventDefault(); undo(); }
  });
  function setDeck(name) {
    deck = name;
    el.tabReview.setAttribute("aria-selected", String(name === "review"));
    el.tabAdopt.setAttribute("aria-selected", String(name === "adopt"));
    el.deckname.textContent = name === "review" ? "要判定" : "採用候補の確認";
    history.length = 0;
    render();
  }
  el.tabReview.addEventListener("click", function () { setDeck("review"); });
  el.tabAdopt.addEventListener("click", function () { setDeck("adopt"); });
  el.again.addEventListener("click", function () {
    var all = items();
    all.forEach(function (it) { delete decisions[it.id]; });
    history.length = 0;
    scheduleWrite();
    render();
  });
  el.copy.addEventListener("click", function () {
    el.out.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    if (navigator.clipboard && !ok) {
      navigator.clipboard.writeText(el.out.value).then(function () {
        el.copy.textContent = "コピーしました";
        setTimeout(function () { el.copy.textContent = "判定をコピー"; }, 1600);
      });
      return;
    }
    el.copy.textContent = ok ? "コピーしました" : "選択したので手動でコピー";
    setTimeout(function () { el.copy.textContent = "判定をコピー"; }, 1600);
  });

  /* ---------- boot ---------- */
  decisions = readLocal();
  render();
  el.sync.textContent = "この端末にだけ保存";

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then(function (d) {
      if (!d) return;
      db = d;
      return db.doc(DOC_PATH).get().then(function (snap) {
        if (snap && snap.exists) {
          var stored = (snap.data() || {}).decisions || {};
          var merged = false;
          Object.keys(stored).forEach(function (k) {
            if (!Object.prototype.hasOwnProperty.call(decisions, k)) { decisions[k] = stored[k]; merged = true; }
          });
          if (merged) { writeLocal(); render(); }
        }
        el.sync.textContent = Object.keys(decisions).length ? "保存済み" : "保存先あり";
        if (Object.keys(decisions).length) scheduleWrite();
      });
    }).catch(function () { el.sync.textContent = "この端末にだけ保存"; });
  }
})();
</script>
